#Circuit breaker pattern
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=productCircuit
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/product
resilience4j.circuitbreaker.instances.productCircuit.automaticTransitionFromOpenToHalfOpenEnabled=true