services:

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================
  # MongoDB
  # =========================
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"


  # =========================
  # Eureka Discovery Server
  # =========================
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8761:8761"


  # =========================
  # Product Service
  # =========================
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mongodb
      - discovery-server
    ports:
      - "8087:8087"


  # =========================
  # Order Service
  # =========================
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8086:8086"


  # =========================
  # Inventory Service
  # =========================
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8085:8085"


  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8081:8081"


  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-server
      - product-service
      - auth-service
      - redis
    ports:
      - "8080:8080"


# =========================
# Named Volumes
# =========================
volumes:
  mysql-data: